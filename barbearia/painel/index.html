<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel — Rick’ Barbearia</title>
<meta name="description" content="Painel de controle de agendamentos da barbearia Rick’ Barbearia.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script src="../firebase-config.js"></script>
<style>
:root{
  --bg:#0a0a0a;
  --bg-2:#141414;
  --bg-3:#1f1f1f;
  --bg-4:#292929;
  --borda:#2f2f2f;
  --texto:#f5f5f5;
  --texto-dim:#a6a6a6;
  --texto-fraco:#6f6f6f;
  --destaque:#e6e6e6;
  --destaque-forte:#ffffff;
  --destaque-suave:#8c8c8c;
  --erro:#e0645a;
  --sucesso:#6fae7f;
  --aviso:#d9a441;
  --info:#8fb3e0;
  --radius:14px;
  --nav-h:66px;
}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Manrope",system-ui,sans-serif;background:var(--bg);color:var(--texto);
  font-size:16px;line-height:1.5;min-height:100vh;
}
a{color:inherit}
button,select,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--destaque);outline-offset:2px}
h1,h2,h3{font-family:"Montserrat",system-ui,sans-serif;letter-spacing:.02em}
.tabular{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.dim{color:var(--texto-dim)}
.fraco{color:var(--texto-fraco)}

/* ---------- Login ---------- */
.tela-login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:radial-gradient(140% 90% at 50% -10%, rgba(255,255,255,.16), transparent 60%), var(--bg);
}
.login-caixa{
  width:100%;max-width:340px;background:var(--bg-2);border:1px solid var(--borda);
  border-radius:var(--radius);padding:2rem 1.6rem;text-align:center;
}
.login-caixa h1{font-size:1.6rem;text-transform:uppercase}
.login-caixa p{color:var(--texto-dim);font-size:.88rem;margin-top:.5rem}
.login-caixa input{
  width:100%;margin-top:1.4rem;background:var(--bg-3);border:1px solid var(--borda);color:var(--texto);
  border-radius:10px;padding:.8rem .9rem;font-size:1rem;text-align:center;
}
.login-caixa input + input{margin-top:.6rem}
.login-caixa .btn-primario{width:100%;margin-top:1rem}
.login-erro{color:var(--erro);font-size:.85rem;margin-top:.8rem}

/* ---------- Estrutura do app ---------- */
.faixa-demo{
  background:var(--aviso);color:#1a1300;font-size:.78rem;font-weight:700;text-align:center;padding:.35rem .8rem;
}
.topo{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--borda);
}
.topo-linha{
  max-width:760px;margin:0 auto;padding:.85rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem;
}
.topo h1{font-size:1.1rem;text-transform:uppercase;line-height:1.2}
.topo .sub{color:var(--texto-dim);font-size:.75rem}
.btn-topo{
  background:var(--bg-3);border:1px solid var(--borda);border-radius:999px;padding:.45rem .9rem;
  font-size:.8rem;font-weight:700;white-space:nowrap;
}
main{max-width:760px;margin:0 auto;padding:1rem 1.1rem calc(var(--nav-h) + 6rem)}
.view{display:none}
.view.ativa{display:block}

.barra-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0d0d0d;border-top:1px solid var(--borda);
  padding-bottom:env(safe-area-inset-bottom);
}
.barra-nav-itens{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  color:var(--texto-fraco);font-size:.68rem;font-weight:700;letter-spacing:.02em;
}
.nav-item svg{width:22px;height:22px}
.nav-item.ativo{color:var(--destaque-forte)}
.nav-item.ativo .nav-ico{background:var(--bg-4)}
.nav-ico{display:flex;align-items:center;justify-content:center;width:44px;height:28px;border-radius:999px;transition:background .15s}

.fab{
  position:fixed;right:max(1.1rem, calc(50% - 380px + 1.1rem));bottom:calc(var(--nav-h) + 1rem + env(safe-area-inset-bottom));
  z-index:35;width:58px;height:58px;border-radius:50%;background:var(--destaque-forte);color:#0a0a0a;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.55);
}
.fab svg{width:26px;height:26px}

/* ---------- Componentes ---------- */
.cartao{background:var(--bg-2);border:1px solid var(--borda);border-radius:var(--radius);padding:1rem}
.titulo-secao{
  font-family:"Montserrat",sans-serif;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--texto-dim);margin:1.5rem 0 .7rem;
}
.chips{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;padding-bottom:.1rem}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;background:var(--bg-2);border:1px solid var(--borda);color:var(--texto-dim);border-radius:999px;
  padding:.42rem .9rem;font-size:.82rem;font-weight:700;white-space:nowrap;
}
.chip.ativo{background:var(--destaque);border-color:var(--destaque);color:#0a0a0a}
.selo{
  display:inline-block;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  border-radius:5px;padding:.18rem .45rem;white-space:nowrap;background:rgba(255,255,255,.14);color:var(--destaque-forte);
}
.selo.st-concluido{background:rgba(111,174,127,.16);color:var(--sucesso)}
.selo.st-cancelado{background:rgba(224,100,90,.16);color:var(--erro)}
.selo.st-faltou{background:rgba(217,164,65,.16);color:var(--aviso)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--bg-3);border:1px solid var(--borda);
  border-radius:999px;padding:.6rem 1rem;font-size:.86rem;font-weight:700;text-decoration:none;
}
.btn.ok{border-color:var(--sucesso);color:var(--sucesso)}
.btn.aviso{border-color:var(--aviso);color:var(--aviso)}
.btn.perigo{border-color:var(--erro);color:var(--erro)}
.btn.zap{border-color:#3a6b48;color:#8fd3a2}
.btn.cheio{background:var(--destaque);border-color:var(--destaque);color:#0a0a0a}
.btn-primario{
  display:block;width:100%;background:var(--destaque);color:#0a0a0a;border:0;border-radius:999px;
  padding:.95rem;font-size:.95rem;font-weight:700;font-family:"Montserrat",sans-serif;letter-spacing:.03em;
  text-transform:uppercase;margin-top:1.3rem;transition:background .15s;
}
.btn-primario:hover{background:var(--destaque-forte)}
.btn-primario:disabled{opacity:.6}
.btn-texto{color:var(--texto-dim);font-size:.82rem;text-decoration:underline;padding:.3rem}
.grade-acoes{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:1rem}
.grade-acoes .btn{width:100%}
.grade-acoes .largo{grid-column:1 / -1}
.lista-vazia{text-align:center;color:var(--texto-dim);padding:2.2rem 1rem;font-size:.92rem}
.info-banner{
  background:rgba(255,255,255,.07);border:1px solid var(--borda);color:var(--texto);
  border-radius:12px;padding:.9rem 1rem;font-size:.86rem;line-height:1.55;margin-bottom:1.1rem;
}
.info-banner b{color:var(--destaque-forte)}
.info-banner p + p{margin-top:.7rem}

/* ---------- Formulários ---------- */
.campo{margin-top:1rem}
.campo:first-child{margin-top:0}
.campo label,.campo .rotulo{display:block;font-weight:700;margin-bottom:.4rem;font-size:.88rem}
.campo input,.campo select,.campo textarea{
  width:100%;background:var(--bg-3);border:1px solid var(--borda);color:var(--texto);
  border-radius:10px;padding:.72rem .8rem;font-size:1rem;
}
.campo textarea{resize:vertical;min-height:3.4rem}
.campo .ajuda{color:var(--texto-dim);font-size:.78rem;margin-top:.35rem}
.linha-2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.linha-2 .campo{margin-top:1rem}
.linha-2:first-child .campo{margin-top:0}
.campo-erro{color:var(--erro);font-size:.83rem;margin-top:.35rem}
.campo.tem-erro input,.campo.tem-erro select{border-color:var(--erro)}
.aviso-conflito{
  background:rgba(217,164,65,.12);border:1px solid var(--aviso);color:var(--aviso);
  border-radius:10px;padding:.65rem .85rem;font-size:.84rem;margin-top:.9rem;
}
.opcoes-forma{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem}
.opcao-forma input{position:absolute;opacity:0;pointer-events:none}
.opcao-forma span{
  display:block;text-align:center;background:var(--bg-3);border:1px solid var(--borda);border-radius:10px;
  padding:.7rem .5rem;font-size:.86rem;font-weight:700;
}
.opcao-forma input:checked + span{background:var(--destaque);color:#0a0a0a;border-color:var(--destaque)}
.opcao-forma input:focus-visible + span{outline:2px solid var(--destaque);outline-offset:2px}
.horarios-sugeridos{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.55rem}
.horarios-sugeridos button{
  background:var(--bg-3);border:1px solid var(--borda);border-radius:8px;padding:.35rem .6rem;font-size:.82rem;font-weight:700;
}
.horarios-sugeridos button.ativo{background:var(--destaque);color:#0a0a0a;border-color:var(--destaque)}

/* ---------- Agenda ---------- */
.agenda-cabecalho{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.8rem}
.btn-mes{display:flex;align-items:center;gap:.35rem;font-family:"Montserrat",sans-serif;font-weight:700;font-size:1.02rem}
.btn-mes svg{width:16px;height:16px;color:var(--texto-dim)}
.alterna{display:flex;background:var(--bg-2);border:1px solid var(--borda);border-radius:999px;padding:3px}
.alterna button{border-radius:999px;padding:.35rem .8rem;font-size:.78rem;font-weight:800;color:var(--texto-dim)}
.alterna button.ativo{background:var(--destaque);color:#0a0a0a}

.faixa-semana{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;gap:.3rem;align-items:center}
.seta-semana{height:100%;display:flex;align-items:center;justify-content:center;color:var(--texto-dim);font-size:1.3rem}
.dia-btn{
  display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.45rem 0 .5rem;border-radius:12px;
  border:1px solid transparent;
}
.dia-btn .sigla{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--texto-fraco)}
.dia-btn .num{font-family:"Montserrat",sans-serif;font-weight:700;font-size:1.05rem}
.dia-btn .pontos{height:6px;display:flex;gap:2px}
.dia-btn .pontos i{width:5px;height:5px;border-radius:50%;background:var(--destaque-suave)}
.dia-btn.hoje{border-color:var(--borda)}
.dia-btn.hoje .sigla{color:var(--destaque-forte)}
.dia-btn.sel{background:var(--destaque);color:#0a0a0a}
.dia-btn.sel .sigla{color:#3a3a3a}
.dia-btn.sel .pontos i{background:#0a0a0a}
.dia-btn.fechado .num{color:var(--texto-fraco)}
.dia-btn.sel.fechado .num{color:#0a0a0a}

.titulo-dia{margin:1.1rem 0 .7rem;display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.titulo-dia h2{font-size:1rem}
.titulo-dia .btn-texto{flex-shrink:0}

.resumo-dia{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.resumo-item{background:var(--bg-2);border:1px solid var(--borda);border-radius:12px;padding:.65rem .7rem}
.resumo-item b{display:block;font-family:"Montserrat",sans-serif;font-size:1.08rem}
.resumo-item span{color:var(--texto-dim);font-size:.7rem;font-weight:600}
.btn-lembrar{
  width:100%;margin-top:.6rem;display:flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--bg-2);border:1px dashed #3a6b48;color:#8fd3a2;border-radius:12px;padding:.65rem;font-size:.84rem;font-weight:700;
}

.linha-tempo{margin-top:1rem;display:flex;flex-direction:column;gap:.4rem}
.slot{
  display:grid;grid-template-columns:54px 1fr;gap:.6rem;align-items:stretch;text-align:left;width:100%;
}
.slot-hora{padding-top:.55rem;font-family:"Montserrat",sans-serif;font-weight:700;font-size:.86rem;color:var(--texto-dim)}
.slot-hora small{display:block;font-family:"Manrope",sans-serif;font-weight:500;font-size:.7rem;color:var(--texto-fraco)}
.slot-livre .slot-caixa{
  border:1px dashed var(--borda);border-radius:12px;padding:.6rem .85rem;color:var(--texto-fraco);font-size:.84rem;
  display:flex;justify-content:space-between;align-items:center;transition:border-color .15s,color .15s;
}
.slot-livre .slot-caixa b{font-weight:800;color:var(--texto-dim)}
.slot-livre:hover .slot-caixa{border-color:var(--destaque-suave);color:var(--texto)}
.slot-livre .mais{font-size:1.2rem;line-height:1;color:var(--texto-dim)}
.slot-livre.passado .slot-caixa{opacity:.45}
.slot-ag .slot-caixa{
  background:var(--bg-2);border:1px solid var(--borda);border-left:4px solid var(--destaque);border-radius:12px;
  padding:.65rem .85rem;display:flex;flex-direction:column;gap:.15rem;
}
.slot-ag.st-concluido .slot-caixa{border-left-color:var(--sucesso)}
.slot-ag.st-faltou .slot-caixa{border-left-color:var(--aviso);opacity:.8}
.slot-ag.st-cancelado .slot-caixa{border-left-color:var(--erro);opacity:.6}
.slot-ag .ag-linha1{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.slot-ag .ag-nome{font-weight:800;font-size:.98rem}
.slot-ag .ag-info{color:var(--texto-dim);font-size:.8rem}
.slot-ag .ag-preco{font-family:"Montserrat",sans-serif;font-weight:700;font-size:.86rem}
.slot-bloq .slot-caixa{
  border-radius:12px;padding:.6rem .85rem;font-size:.84rem;color:var(--texto-dim);border:1px solid var(--borda);
  background:repeating-linear-gradient(-45deg,var(--bg-2),var(--bg-2) 8px,var(--bg-3) 8px,var(--bg-3) 16px);
}
.slot-pausa{display:flex;align-items:center;gap:.6rem;color:var(--texto-fraco);font-size:.74rem;font-weight:700;margin:.3rem 0}
.slot-pausa::before,.slot-pausa::after{content:"";flex:1;height:1px;background:var(--borda)}
.slot-agora{display:flex;align-items:center;gap:.5rem;color:var(--erro);font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.slot-agora::after{content:"";flex:1;height:2px;background:var(--erro);border-radius:2px}
.dia-fechado{text-align:center;padding:1.6rem 1rem;color:var(--texto-dim)}
.dia-fechado b{display:block;color:var(--texto);font-size:1rem;margin-bottom:.3rem}
.cancelados-dia{margin-top:1rem}
.cancelados-dia summary{cursor:pointer;color:var(--texto-dim);font-size:.84rem;font-weight:700;padding:.4rem 0}
.cancelados-dia .linha-tempo{margin-top:.4rem}

.semana-dia{margin-top:1.1rem}
.semana-dia h3{font-size:.86rem;display:flex;justify-content:space-between;color:var(--texto);margin-bottom:.5rem}
.semana-dia h3 span{color:var(--texto-dim);font-family:"Manrope",sans-serif;font-weight:600;font-size:.78rem}
.linha-compacta{
  display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:var(--bg-2);border:1px solid var(--borda);
  border-radius:10px;padding:.55rem .75rem;margin-bottom:.35rem;
}
.linha-compacta .hora{font-family:"Montserrat",sans-serif;font-weight:700;font-size:.86rem;width:42px;flex-shrink:0}
.linha-compacta .meio{flex:1;min-width:0}
.linha-compacta .meio b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-compacta .meio span{color:var(--texto-dim);font-size:.76rem}

/* calendário do mês */
.cal-cabecalho{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.cal-cabecalho b{font-family:"Montserrat",sans-serif}
.cal-cabecalho button{width:36px;height:36px;border-radius:50%;background:var(--bg-3);border:1px solid var(--borda);font-size:1.1rem}
.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;text-align:center}
.cal-sem{font-size:.66rem;font-weight:800;color:var(--texto-fraco);text-transform:uppercase;padding:.2rem 0}
.cal-dia{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;position:relative}
.cal-dia small{font-size:.6rem;font-weight:800;color:var(--texto-dim);line-height:1}
.cal-dia.vazio{visibility:hidden}
.cal-dia.hoje{border:1px solid var(--destaque-suave)}
.cal-dia.sel{background:var(--destaque);color:#0a0a0a}
.cal-dia.sel small{color:#333}
.cal-dia.fechado{color:var(--texto-fraco)}

/* ---------- Ficha (bottom sheet) ---------- */
.sheet-fundo{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg-2);border:1px solid var(--borda);
  border-bottom:0;border-radius:20px 20px 0 0;padding:.6rem 1.15rem calc(1.4rem + env(safe-area-inset-bottom));
  animation:subir .2s ease-out;
}
@keyframes subir{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-alca{width:42px;height:4px;border-radius:4px;background:var(--bg-4);margin:0 auto .8rem}
.sheet-topo{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-bottom:1rem}
.sheet-topo h2{font-size:1.02rem;text-transform:uppercase}
.sheet-fechar{width:34px;height:34px;border-radius:50%;background:var(--bg-3);border:1px solid var(--borda);font-size:1rem;flex-shrink:0}
@media (min-width:640px){
  .sheet-fundo{align-items:center}
  .sheet{border-radius:20px;border-bottom:1px solid var(--borda)}
}
.ficha-hora{font-family:"Montserrat",sans-serif;font-size:1.8rem;font-weight:700;line-height:1.1}
.ficha-linhas{margin-top:1rem;border-top:1px solid var(--borda)}
.ficha-linha{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--borda);font-size:.9rem}
.ficha-linha span:first-child{color:var(--texto-dim)}
.ficha-linha span:last-child{text-align:right;font-weight:700}
.link-cliente{text-decoration:underline;text-underline-offset:3px}

/* ---------- Clientes ---------- */
.busca{
  width:100%;background:var(--bg-2);border:1px solid var(--borda);border-radius:12px;padding:.75rem .9rem;font-size:1rem;color:var(--texto);
}
.cli-item{
  display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.7rem .2rem;border-bottom:1px solid var(--borda);
}
.avatar{
  width:42px;height:42px;border-radius:50%;background:var(--bg-3);border:1px solid var(--borda);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:"Montserrat",sans-serif;font-weight:700;font-size:.95rem;
}
.cli-meio{flex:1;min-width:0}
.cli-meio b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli-meio span{color:var(--texto-dim);font-size:.78rem}
.cli-direita{text-align:right;font-size:.74rem;color:var(--texto-dim);flex-shrink:0}
.cli-direita b{display:block;color:var(--texto);font-size:.86rem}
.perfil-topo{display:flex;align-items:center;gap:.9rem}

/* ---------- Financeiro / Relatórios ---------- */
.nav-mes{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}

}

/* catálogo (editor) */

</style>

<body>

  <header class="topo">

<script>
'use strict';

/* =========================================================
   1. CONFIGURAÇÃO
   ========================================================= */
// Abra o painel com ?demo no fim do endereço pra ver uma prévia com
// dados de exemplo (sem login, sem Firebase, nada é salvo).
const DEMO = new URLSearchParams(location.search).has('demo') || window.PAINEL_DEMO === true;

const CONFIG_PAINEL = {
  // Só é usada quando o Firebase NÃO está configurado. Com Firebase, a entrada
  // exige a conta de dono. Vazia = painel trancado até você definir uma.
  senha: '',
  nomeLoja: 'Rick’ Barbearia',
  whatsapp: '559889247025',  // mesmo número do site público
  fuso: 'America/Sao_Paulo',
  intervaloMin: 30,          // tamanho de cada horário na grade da agenda
  // Mesma lista de serviços e barbeiros do site público (barbearia/index.html).
  servicos: [
    { id: 'corte', nome: 'Corte', duracaoMin: 30, preco: 40 },
    { id: 'barba', nome: 'Barba', duracaoMin: 30, preco: 35 },
    { id: 'combo', nome: 'Corte + Barba', duracaoMin: 60, preco: 65 },
    { id: 'navalha', nome: 'Acabamento na navalha', duracaoMin: 20, preco: 20 },
    { id: 'sobrancelha', nome: 'Sobrancelha', duracaoMin: 15, preco: 15 },
  ],
  barbeiros: [
    { id: 'rickelme', nome: 'Rickelme', especialidade: 'Corte, barba e acabamento', foto: 'rickelme.jpg' },
  ],
  horarios: {
    0: [],
    1: [['09:00', '12:00'], ['14:00', '19:00']],
    2: [['09:00', '12:00'], ['14:00', '19:00']],
    3: [['09:00', '12:00'], ['14:00', '19:00']],
    4: [['09:00', '12:00'], ['14:00', '19:00']],
    5: [['09:00', '12:00'], ['14:00', '19:00']],
    6: [['09:00', '12:00'], ['14:00', '19:00']],
  },
};

const PREFS_PADRAO = {
  metaMensal: 4000,
  msgConfirmacao: 'Olá, {nome}! Seu horário na {barbearia} está confirmado: {servico} {data} às {hora}. Qualquer imprevisto é só avisar por aqui. 💈',
  msgLembrete: 'Oi, {nome}! Passando pra lembrar do seu horário {data} às {hora} ({servico}) na {barbearia}. Te espero!',
  msgAniversario: 'Feliz aniversário, {nome}! 🎉 A {barbearia} deseja um dia incrível. Que tal comemorar de visual novo? Responde aqui que eu separo um horário pra você.',
  msgRetorno: 'Oi, {nome}! Faz um tempinho que você não aparece na {barbearia}. Bora dar um trato no visual? Me fala o melhor dia que eu vejo um horário. ✂️',
};

const FORMAS_PAGAMENTO = { pix: 'Pix', dinheiro: 'Dinheiro', debito: 'Cartão de débito', credito: 'Cartão de crédito', cortesia: 'Cortesia' };
const CATEGORIAS_DESPESA = ['Aluguel', 'Produtos', 'Energia', 'Água', 'Internet', 'Comissão', 'Manutenção', 'Marketing', 'Outros'];
const ROTULOS_STATUS = { confirmado: 'Agendado', concluido: 'Finalizado', cancelado: 'Cancelado', faltou: 'Faltou' };
const SIGLAS_SEMANA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

/* =========================================================
   2. HELPERS
   ========================================================= */
const escaparHTML = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (ch) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const formatarPreco = (v) => BRL.format(Number(v) || 0);
const paraMinutos = (hhmm) => { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + m; };
const paraHHMM = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const gerarId = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const slugify = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'item';
const soDigitos = (t) => String(t || '').replace(/\D/g, '');
const primeiroNome = (n) => String(n || '').trim().split(/\s+/)[0] || '';
const iniciais = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toUpperCase();

function hojeISO() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG_PAINEL.fuso, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function agoraMin() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG_PAINEL.fuso, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
  return paraMinutos(p);
}
function isoParaData(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); }
function somarDiasISO(iso, n) { const dt = isoParaData(iso); dt.setUTCDate(dt.getUTCDate() + n); return dt.toISOString().slice(0, 10); }
function diaSemana(iso) { return isoParaData(iso).getUTCDay(); }
function diasEntre(a, b) { return Math.round((isoParaData(b) - isoParaData(a)) / 86400000); }
const fmtData = (opts) => new Intl.DateTimeFormat('pt-BR', { timeZone: 'UTC', ...opts });
const dataLonga = (iso) => cap(fmtData({ weekday: 'long', day: '2-digit', month: 'long' }).format(isoParaData(iso)));
const dataCurta = (iso) => fmtData({ day: '2-digit', month: '2-digit' }).format(isoParaData(iso));
const dataMedia = (iso) => fmtData({ weekday: 'short', day: '2-digit', month: '2-digit' }).format(isoParaData(iso)).replace('.', '');
function nomeMes(ym) { const [y, m] = ym.split('-').map(Number); return cap(fmtData({ month: 'long', year: 'numeric' }).format(new Date(Date.UTC(y, m - 1, 15)))); }
function somarMeses(ym, n) { const [y, m] = ym.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 15)); return d.toISOString().slice(0, 7); }
function ultimoDiaMes(ym) { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function quandoRelativo(iso) {
  const hoje = hojeISO();
  if (iso === hoje) return 'hoje';
  if (iso === somarDiasISO(hoje, 1)) return 'amanhã';
  if (iso === somarDiasISO(hoje, -1)) return 'ontem';
  return dataMedia(iso);
}
function formatarTelefone(t) {
  let d = soDigitos(t);
  if (d.length > 11 && d.startsWith('55')) d = d.slice(2);
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return d;
}
function numeroWhats(t) { const d = soDigitos(t); return (d.length === 10 || d.length === 11) ? '55' + d : d; }
const linkWhatsApp = (numero, texto) => `https://wa.me/${numeroWhats(numero)}${texto ? '?text=' + encodeURIComponent(texto) : ''}`;

function preencherModelo(modelo, dados) {
  const quando = !dados.data ? '' : dados.data === hojeISO() ? 'hoje' : dados.data === somarDiasISO(hojeISO(), 1) ? 'amanhã'
    : `dia ${dataCurta(dados.data)} (${fmtData({ weekday: 'long' }).format(isoParaData(dados.data)).replace('-feira', '')})`;
  const mapa = {
    nome: primeiroNome(dados.nome), data: quando, hora: dados.hora || '', servico: dados.servico || '',
    barbeiro: dados.barbeiro || '', barbearia: nomeLoja(),
  };
  return String(modelo).replace(/\{(\w+)\}/g, (m, chave) => (chave in mapa ? mapa[chave] : m)).replace(/\s{2,}/g, ' ').trim();
}

let toastTimer = null;
function toast(texto) {
  const el = document.getElementById('toast');
  el.textContent = texto; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

/* =========================================================
   3. FIREBASE (opcional) e catálogo
   ========================================================= */
let db = null;
let auth = null;
let firebaseConfigurado = false;
if (!DEMO) {
  try {
    const cfg = window.FIREBASE_CONFIG;
    if (typeof firebase !== 'undefined' && cfg && cfg.apiKey && cfg.apiKey !== 'COLE_AQUI') {
      firebase.initializeApp(cfg);
      auth = firebase.auth();
      db = firebase.firestore();
      firebaseConfigurado = true;
    }
  } catch (e) { /* segue só com os dados/senha locais */ }
}

let catalogoRemoto = null;
let catalogoAutenticado = false;
let dadosCatalogoEdicao = null;
let modoRemoto = false;

function servicosAtivos() { return (catalogoRemoto && catalogoRemoto.servicos) || CONFIG_PAINEL.servicos; }
function barbeirosAtivos() { return (catalogoRemoto && catalogoRemoto.barbeiros) || CONFIG_PAINEL.barbeiros; }
function horariosAtivos() { return (catalogoRemoto && catalogoRemoto.horarios) || CONFIG_PAINEL.horarios; }
function nomeLoja() { return (catalogoRemoto && catalogoRemoto.nome) || CONFIG_PAINEL.nomeLoja; }
function acharServico(id) { return servicosAtivos().find((s) => s.id === id) || null; }
function acharBarbeiro(id) { return barbeirosAtivos().find((b) => b.id === id) || null; }
function periodosDoDia(iso) {
  const h = horariosAtivos();
  const lista = h[diaSemana(iso)] || h[String(diaSemana(iso))] || [];
  return lista.map(([a, b]) => [paraMinutos(a), paraMinutos(b)]).sort((x, y) => x[0] - y[0]);
}

async function carregarCatalogoRemoto() {
  if (!db) return;
  try {
    const doc = await db.collection('configuracao').doc('dados').get();
    if (doc.exists) catalogoRemoto = doc.data();
  } catch (e) { /* mantém o catálogo local */ }
  renderAtual();
}

/* =========================================================
   4. DADOS — agendamentos, bloqueios, clientes, despesas e
   preferências. Com Firebase (dono logado) tudo vive no
   Firestore; sem Firebase, no navegador deste aparelho; no
   modo prévia (?demo), só na memória.
   ========================================================= */
const CHAVES_LOCAIS = {
  agendamentos: 'barbanobre-painel-agendamentos',
  bloqueios: 'barbanobre-painel-bloqueios',
  clientes: 'barbanobre-painel-clientes',
  despesas: 'barbanobre-painel-despesas',
};
const CHAVE_PREFS = 'barbanobre-painel-prefs';
const estado = { agendamentos: [], bloqueios: [], clientes: [], despesas: [] };
let prefs = { ...PREFS_PADRAO };

function lerLocal(chave, padrao) {
  try { const v = JSON.parse(localStorage.getItem(chave)); return v == null ? padrao : v; } catch (e) { return padrao; }
}
function gravarLocal(col) {
  if (DEMO) return;
  try { localStorage.setItem(CHAVES_LOCAIS[col], JSON.stringify(estado[col])); } catch (e) { /* ignora */ }
}
function carregarLocais() {
  for (const col of Object.keys(CHAVES_LOCAIS)) {
    const l = lerLocal(CHAVES_LOCAIS[col], []);
    estado[col] = Array.isArray(l) ? l : [];
  }
  prefs = { ...PREFS_PADRAO, ...lerLocal(CHAVE_PREFS, {}) };
}

function explicarErro(e) {
  if (e && e.code === 'permission-denied') return 'Sem permissão no Firebase. Publique as regras novas do Firestore (veja o README).';
  return (e && e.message) || String(e);
}
async function criarRegistro(col, dados) {
  try {
    if (modoRemoto) {
      const ref = await db.collection(col).add({ ...dados, criadoEm: firebase.firestore.FieldValue.serverTimestamp() });
      return ref.id;
    }
    const item = { id: gerarId(), ...dados, criadoEm: Date.now() };
    estado[col].push(item);
    gravarLocal(col);
    renderAtual();
    return item.id;
  } catch (e) { toast('Não foi possível salvar. ' + explicarErro(e)); return null; }
}
async function atualizarRegistro(col, id, campos) {
  try {
    if (modoRemoto) { await db.collection(col).doc(id).update(campos); return true; }
    const r = estado[col].find((x) => x.id === id);
    if (r) Object.assign(r, campos);
    gravarLocal(col);
    renderAtual();
    return true;
  } catch (e) { toast('Não foi possível atualizar. ' + explicarErro(e)); return false; }
}
async function removerRegistro(col, id) {
  try {
    if (modoRemoto) { await db.collection(col).doc(id).delete(); return true; }
    estado[col] = estado[col].filter((x) => x.id !== id);
    gravarLocal(col);
    renderAtual();
    return true;
  } catch (e) { toast('Não foi possível excluir. ' + explicarErro(e)); return false; }
}
async function salvarPrefs(novas) {
  prefs = { ...prefs, ...novas };
  try {
    if (modoRemoto) await db.collection('painelDono').doc('config').set(prefs, { merge: true });
    else if (!DEMO) localStorage.setItem(CHAVE_PREFS, JSON.stringify(prefs));
  } catch (e) { toast('Não foi possível salvar. ' + explicarErro(e)); }
  renderAtual();
}

const pararListeners = [];
function iniciarListenersRemotos() {
  if (!db || pararListeners.length) return;
  pararListeners.push(db.collection('agendamentos').orderBy('criadoEm', 'desc').limit(2000).onSnapshot((snap) => {
    estado.agendamentos = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
    renderAtual();
  }, (erro) => toast('Não foi possível carregar a agenda (' + (erro.code || erro.message) + ')')));
  for (const col of ['bloqueios', 'clientes', 'despesas']) {
    pararListeners.push(db.collection(col).onSnapshot((snap) => {
      estado[col] = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
      renderAtual();
    }, () => { /* regras ainda não publicadas: segue sem essa lista */ }));
  }
  pararListeners.push(db.collection('painelDono').doc('config').onSnapshot((doc) => {
    if (doc.exists) prefs = { ...PREFS_PADRAO, ...doc.data() };
    renderAtual();
  }, () => {}));
}
function pararListenersRemotos() { while (pararListeners.length) pararListeners.pop()(); }

/* ---------- Derivados ---------- */
function servicoDe(ag) { return acharServico(ag.servicoId); }
function duracaoDe(ag) { const s = servicoDe(ag); return Number(ag.duracaoMin) || (s ? s.duracaoMin : CONFIG_PAINEL.intervaloMin); }
function precoDe(ag) {
  if (ag.pagamento && ag.pagamento.valor != null) return Number(ag.pagamento.valor) || 0;
  if (ag.servicoPreco != null) return Number(ag.servicoPreco) || 0;
  const s = servicoDe(ag); return s ? Number(s.preco) : 0;
}
function nomeServicoDe(ag) { const s = servicoDe(ag); return s ? s.nome : (ag.servicoNome || 'Serviço'); }
function recebidoDe(ag) { return ag.status === 'concluido' ? precoDe(ag) : 0; }
function agsDoDia(iso) { return estado.agendamentos.filter((a) => a.data === iso).sort((a, b) => a.horarioMin - b.horarioMin); }
const ativo = (a) => a.status !== 'cancelado';

function chaveCliente(nome, tel) {
  const d = soDigitos(tel);
  return d.length >= 8 ? 't' + d.slice(-8) : 'n' + slugify(nome || 'sem-nome');
}
function listaClientes() {
  const mapa = new Map();
  const garantir = (chave, nome, tel) => {
    if (!mapa.has(chave)) mapa.set(chave, { chave, nome: nome || 'Sem nome', telefone: soDigitos(tel), cadastro: null, ags: [] });
    return mapa.get(chave);
  };
  for (const c of estado.clientes) {
    const cli = garantir(chaveCliente(c.nome, c.telefone), c.nome, c.telefone);
    cli.cadastro = c; cli.nome = c.nome || cli.nome; if (c.telefone) cli.telefone = soDigitos(c.telefone);
  }
  for (const ag of estado.agendamentos) {
    const cli = garantir(chaveCliente(ag.clienteNome, ag.telefone), ag.clienteNome, ag.telefone);
    cli.ags.push(ag);
    if (!cli.telefone && ag.telefone) cli.telefone = soDigitos(ag.telefone);
  }
  const hoje = hojeISO();
  for (const cli of mapa.values()) {
    cli.ags.sort((a, b) => (a.data + paraHHMM(a.horarioMin)).localeCompare(b.data + paraHHMM(b.horarioMin)));
    const feitos = cli.ags.filter((a) => a.status === 'concluido');
    cli.visitas = feitos.length;
    cli.faltas = cli.ags.filter((a) => a.status === 'faltou').length;
    cli.totalGasto = feitos.reduce((s, a) => s + precoDe(a), 0);
    cli.ultimaVisita = feitos.length ? feitos[feitos.length - 1].data : null;
    cli.proximo = cli.ags.find((a) => a.status === 'confirmado' && a.data >= hoje) || null;
    cli.primeiraData = cli.ags.length ? cli.ags[0].data : null;
    cli.aniversario = cli.cadastro && cli.cadastro.aniversario ? cli.cadastro.aniversario : null; // 'MM-DD'
    cli.obs = cli.cadastro && cli.cadastro.obs ? cli.cadastro.obs : '';
  }
  return [...mapa.values()];
}
function acharCliente(chave) { return listaClientes().find((c) => c.chave === chave) || null; }

/* =========================================================
   5. LOGIN
   ========================================================= */
function jaEstaLogado() { try { return sessionStorage.getItem('barbanobre-painel-logado') === '1'; } catch (e) { return false; } }
function marcarLogado() { try { sessionStorage.setItem('barbanobre-painel-logado', '1'); } catch (e) { /* ignora */ } }
function limparLogin() { try { sessionStorage.removeItem('barbanobre-painel-logado'); } catch (e) { /* ignora */ } }
function mostrarErroLogin(texto) { const el = document.getElementById('login-erro'); el.textContent = texto; el.hidden = false; }

async function tentarEntrar() {
  const senha = document.getElementById('in-senha').value;
  document.getElementById('login-erro').hidden = true;
  if (firebaseConfigurado) {
    const email = document.getElementById('in-email').value.trim();
    if (!email || !senha) { mostrarErroLogin('Preencha e-mail e senha.'); return; }
    const btn = document.getElementById('btn-entrar');
    btn.disabled = true;
    try { await auth.signInWithEmailAndPassword(email, senha); }
    catch (e) { mostrarErroLogin('E-mail ou senha inválidos.'); }
    finally { btn.disabled = false; }
    return;
  }
  if (!CONFIG_PAINEL.senha) mostrarErroLogin('Defina uma senha em CONFIG_PAINEL ou configure o Firebase.');
  else if (senha === CONFIG_PAINEL.senha) { marcarLogado(); mostrarApp(); }
  else mostrarErroLogin('Senha incorreta.');
}
function mostrarApp() {
  if (!document.getElementById('app-painel').hidden) return;
  document.getElementById('tela-login').hidden = true;
  document.getElementById('app-painel').hidden = false;
  inicializarApp();
}
document.getElementById('btn-entrar').addEventListener('click', tentarEntrar);
document.getElementById('in-senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') tentarEntrar(); });
document.getElementById('in-email').addEventListener('keydown', (e) => { if (e.key === 'Enter') tentarEntrar(); });
if (firebaseConfigurado) {
  document.getElementById('in-email').hidden = false;
  document.getElementById('login-instrucao').textContent = 'Painel do dono — entre com sua conta';
}
function sair() {
  limparLogin();
  if (DEMO) { location.reload(); return; }
  if (auth && auth.currentUser) auth.signOut().finally(() => location.reload());
  else location.reload();
}

/* =========================================================
   6. NAVEGAÇÃO ENTRE TELAS
   ========================================================= */
let viewAtual = 'agenda';
let subMais = null;              // 'bloqueios' | 'catalogo' | 'mensagens' | 'ajuda' | null
let dataSel = null;              // dia escolhido na agenda (ISO)
let modoAgenda = 'dia';          // 'dia' | 'semana'
let filtroBarbeiro = 'todos';
let mesFinanceiro = null;        // 'YYYY-MM'
let periodoRelatorio = 'mes';
let filtroClientes = 'todos';
let buscaClientes = '';

const TITULOS = { agenda: 'Agenda', clientes: 'Clientes', financeiro: 'Financeiro', relatorios: 'Relatórios', mais: 'Mais' };

function trocarView(nome) {
  viewAtual = nome;
  if (nome !== 'mais') subMais = null;
  document.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('ativo', b.dataset.view === nome));
  document.querySelectorAll('.view').forEach((s) => s.classList.toggle('ativa', s.id === 'view-' + nome));
  montarView(nome);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.nav-item').forEach((b) => b.addEventListener('click', () => trocarView(b.dataset.view)));

function atualizarTopo() {
  document.getElementById('topo-titulo').textContent = TITULOS[viewAtual];
  const sub = document.getElementById('topo-sub');
  const acao = document.getElementById('topo-acao');
  const fab = document.getElementById('fab');
  acao.hidden = true; fab.hidden = false;
  if (viewAtual === 'agenda') {
    sub.textContent = nomeLoja();
    acao.hidden = dataSel === hojeISO(); acao.textContent = 'Hoje'; acao.dataset.acao = 'ir-hoje';
    fab.setAttribute('aria-label', 'Novo agendamento'); fab.dataset.acao = 'novo-ag';
  } else if (viewAtual === 'clientes') {
    sub.textContent = `${listaClientes().length} cliente(s)`;
    fab.setAttribute('aria-label', 'Novo cliente'); fab.dataset.acao = 'novo-cliente';
  } else if (viewAtual === 'financeiro') {
    sub.textContent = 'Receitas, despesas e meta do mês';
    fab.setAttribute('aria-label', 'Nova despesa'); fab.dataset.acao = 'nova-despesa';
  } else if (viewAtual === 'relatorios') {
    sub.textContent = 'Desempenho da barbearia'; fab.hidden = true;
  } else {
    sub.textContent = nomeLoja(); fab.hidden = true;
    acao.hidden = false; acao.textContent = 'Sair'; acao.dataset.acao = 'sair';
  }
}

// Monta a estrutura da tela (formulários incluídos) e depois os dados.
function montarView(nome) {
  if (nome === 'agenda') renderAgenda();
  if (nome === 'clientes') montarClientes();
  if (nome === 'financeiro') renderFinanceiro();
  if (nome === 'relatorios') montarRelatorios();
  if (nome === 'mais') montarMais();
  atualizarTopo();
}
// Chamada sempre que os dados mudam: só atualiza as partes com dados,
// sem apagar o que o dono estiver digitando.
function renderAtual() {
  if (document.getElementById('app-painel').hidden) return;
  if (viewAtual === 'agenda') renderAgenda();
  if (viewAtual === 'clientes') renderListaClientes();
  if (viewAtual === 'financeiro') renderFinanceiro();
  if (viewAtual === 'relatorios') renderRelatorios();
  if (viewAtual === 'mais' && subMais === 'bloqueios') renderListaBloqueios();
  atualizarTopo();
}

/* =========================================================
   7. AGENDA
   ========================================================= */
function contarDoDia(iso) {
  return estado.agendamentos.filter((a) => a.data === iso && ativo(a) && (filtroBarbeiro === 'todos' || a.barbeiroId === filtroBarbeiro)).length;
}
function bloqueiosDoDia(iso) { return estado.bloqueios.filter((b) => b.data === iso); }

function montarGrade(iso, ignorarId) {
  const periodos = periodosDoDia(iso);
  const bloqs = bloqueiosDoDia(iso);
  const diaTodo = bloqs.find((b) => b.diaTodo) || null;
  const barbeiros = barbeirosAtivos();
  const considerados = filtroBarbeiro === 'todos' ? barbeiros.map((b) => b.id) : [filtroBarbeiro];
  const ags = agsDoDia(iso).filter((a) => ativo(a) && a.id !== ignorarId);
  const visiveis = ags.filter((a) => filtroBarbeiro === 'todos' || a.barbeiroId === filtroBarbeiro);
  const passo = CONFIG_PAINEL.intervaloMin;
  const sobrepoe = (a, ini, fim) => a.horarioMin < fim && a.horarioMin + duracaoDe(a) > ini;
  const ocupado = (ini, fim) => {
    if (barbeiros.length <= 1) return ags.some((a) => sobrepoe(a, ini, fim));
    return considerados.every((bid) => ags.some((a) => a.barbeiroId === bid && sobrepoe(a, ini, fim)));
  };
  const bloqueioEm = (ini, fim) => bloqs.find((b) => !b.diaTodo && b.inicio && b.fim && paraMinutos(b.inicio) < fim && paraMinutos(b.fim) > ini) || null;

  const itens = [];
  periodos.forEach(([ini, fim], k) => {
    if (k > 0) itens.push({ tipo: 'pausa', min: periodos[k - 1][1], fim: ini });
    for (let t = ini; t < fim; t += passo) {
      const fimSlot = Math.min(t + passo, fim);
      if (ocupado(t, fimSlot)) continue;
      const b = diaTodo || bloqueioEm(t, fimSlot);
      itens.push(b ? { tipo: 'bloq', min: t, fim: fimSlot, motivo: b.motivo } : { tipo: 'livre', min: t, fim: fimSlot });
    }
  });
  visiveis.forEach((ag) => itens.push({ tipo: 'ag', min: ag.horarioMin, fim: ag.horarioMin + duracaoDe(ag), ag }));
  const ordem = { pausa: 0, ag: 1, bloq: 2, livre: 3 };
  itens.sort((a, b) => a.min - b.min || ordem[a.tipo] - ordem[b.tipo]);

  // junta bloqueios seguidos num bloco só
  const juntos = [];
  for (const it of itens) {
    const ult = juntos[juntos.length - 1];
    if (it.tipo === 'bloq' && ult && ult.tipo === 'bloq' && ult.fim === it.min && ult.motivo === it.motivo) ult.fim = it.fim;
    else juntos.push({ ...it });
  }
  return { itens: juntos, periodos, diaTodo, livres: juntos.filter((i) => i.tipo === 'livre') };
}

function htmlSlotAg(ag) {
  const barbeiro = barbeirosAtivos().length > 1 ? ' · ' + escaparHTML(ag.barbeiroNome || '') : '';
  return `
    <button class="slot slot-ag st-${ag.status}" type="button" data-acao="abrir-ag" data-id="${escaparHTML(ag.id)}">
      <span class="slot-hora tabular">${paraHHMM(ag.horarioMin)}<small>${paraHHMM(ag.horarioMin + duracaoDe(ag))}</small></span>
      <span class="slot-caixa">
        <span class="ag-linha1"><span class="ag-nome">${escaparHTML(ag.clienteNome)}</span><span class="ag-preco tabular">${formatarPreco(precoDe(ag))}</span></span>
        <span class="ag-linha1"><span class="ag-info">${escaparHTML(nomeServicoDe(ag))}${barbeiro}${ag.origem === 'site' ? ' · pelo site' : ''}</span>
        <span class="selo st-${ag.status}">${ROTULOS_STATUS[ag.status] || escaparHTML(ag.status)}</span></span>
      </span>
    </button>`;
}

function renderAgenda() {
  const alvo = document.getElementById('view-agenda');
  const hoje = hojeISO();
  if (!dataSel) dataSel = hoje;
  const inicioSemana = somarDiasISO(dataSel, -diaSemana(dataSel));
  const barbeiros = barbeirosAtivos();

  const faixa = Array.from({ length: 7 }, (_, i) => {
    const iso = somarDiasISO(inicioSemana, i);
    const n = contarDoDia(iso);
    const fechado = !periodosDoDia(iso).length || bloqueiosDoDia(iso).some((b) => b.diaTodo);
    const cls = ['dia-btn', iso === hoje ? 'hoje' : '', iso === dataSel ? 'sel' : '', fechado ? 'fechado' : ''].join(' ');
    return `<button class="${cls}" type="button" data-acao="sel-dia" data-data="${iso}" aria-label="${escaparHTML(dataLonga(iso))}, ${n} agendamento(s)">
      <span class="sigla">${SIGLAS_SEMANA[i]}</span><span class="num tabular">${Number(iso.slice(8))}</span>
      <span class="pontos">${'<i></i>'.repeat(Math.min(n, 4))}</span></button>`;
  }).join('');

  let corpo = '';
  if (modoAgenda === 'dia') corpo = htmlDia(dataSel);
  else corpo = htmlSemana(inicioSemana);

  alvo.innerHTML = `
    <div class="agenda-cabecalho">
      <button class="btn-mes" type="button" data-acao="abrir-calendario">${escaparHTML(nomeMes(dataSel.slice(0, 7)))}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="alterna" role="group" aria-label="Visualização">
        <button type="button" class="${modoAgenda === 'dia' ? 'ativo' : ''}" data-acao="modo-agenda" data-modo="dia">Dia</button>
        <button type="button" class="${modoAgenda === 'semana' ? 'ativo' : ''}" data-acao="modo-agenda" data-modo="semana">Semana</button>
      </div>
    </div>
    <div class="faixa-semana">
      <button class="seta-semana" type="button" data-acao="semana" data-n="-7" aria-label="Semana anterior">‹</button>
      ${faixa}
      <button class="seta-semana" type="button" data-acao="semana" data-n="7" aria-label="Próxima semana">›</button>
    </div>
    ${barbeiros.length > 1 ? `<div class="chips" style="margin-top:.8rem">
      <button class="chip ${filtroBarbeiro === 'todos' ? 'ativo' : ''}" type="button" data-acao="filtro-barbeiro" data-id="todos">Todos</button>
      ${barbeiros.map((b) => `<button class="chip ${filtroBarbeiro === b.id ? 'ativo' : ''}" type="button" data-acao="filtro-barbeiro" data-id="${escaparHTML(b.id)}">${escaparHTML(b.nome)}</button>`).join('')}
    </div>` : ''}
    ${corpo}`;
}

function htmlDia(iso) {
  const hoje = hojeISO();
  const doDia = agsDoDia(iso).filter((a) => filtroBarbeiro === 'todos' || a.barbeiroId === filtroBarbeiro);
  const ativos = doDia.filter((a) => ativo(a) && a.status !== 'faltou');
  const previsto = ativos.reduce((s, a) => s + precoDe(a), 0);
  const recebido = doDia.reduce((s, a) => s + recebidoDe(a), 0);
  const paraLembrar = doDia.filter((a) => a.status === 'confirmado' && a.telefone);
  const { itens, periodos, diaTodo, livres } = montarGrade(iso);
  const minAgora = iso === hoje ? agoraMin() : null;

  let linha = '';
  if (!periodos.length && !doDia.filter(ativo).length) {
    linha = `<div class="cartao dia-fechado"><b>Fechado neste dia</b>Pelo horário de funcionamento, a barbearia não abre.
      <div style="margin-top:1rem"><button class="btn" type="button" data-acao="novo-ag" data-data="${iso}">Agendar mesmo assim</button></div></div>`;
  } else {
    let agoraPosto = minAgora == null;
    linha = itens.map((it) => {
      let pre = '';
      if (!agoraPosto && it.tipo !== 'pausa' && it.min >= minAgora) { pre = `<div class="slot-agora">agora · ${paraHHMM(minAgora)}</div>`; agoraPosto = true; }
      if (it.tipo === 'pausa') return `<div class="slot-pausa">intervalo ${paraHHMM(it.min)}–${paraHHMM(it.fim)}</div>`;
      if (it.tipo === 'ag') return pre + htmlSlotAg(it.ag);
      if (it.tipo === 'bloq') return pre + `<div class="slot slot-bloq"><span class="slot-hora tabular">${paraHHMM(it.min)}<small>${paraHHMM(it.fim)}</small></span>
        <span class="slot-caixa">Bloqueado${it.motivo ? ' · ' + escaparHTML(it.motivo) : ''}</span></div>`;
      const passado = minAgora != null && it.fim <= minAgora;
      return pre + `<button class="slot slot-livre ${passado ? 'passado' : ''}" type="button" data-acao="novo-ag" data-data="${iso}" data-hora="${paraHHMM(it.min)}">
        <span class="slot-hora tabular">${paraHHMM(it.min)}</span>
        <span class="slot-caixa"><span><b>Livre</b> · toque para agendar</span><span class="mais">+</span></span></button>`;
    }).join('');
    if (diaTodo) linha = `<div class="info-banner" style="margin:0 0 .4rem">Dia bloqueado${diaTodo.motivo ? ': <b>' + escaparHTML(diaTodo.motivo) + '</b>' : ''}. Os clientes não devem conseguir marcar.</div>` + linha;
  }
  const cancelados = doDia.filter((a) => a.status === 'cancelado');

  return `
    <div class="titulo-dia">
      <h2>${iso === hoje ? 'Hoje, ' + escaparHTML(dataLonga(iso).toLowerCase()) : escaparHTML(dataLonga(iso))}</h2>
      <span class="dim" style="font-size:.78rem">${livres.length} livre(s)</span>
    </div>
    <div class="resumo-dia">
      <div class="resumo-item"><b class="tabular">${ativos.length}</b><span>atendimentos</span></div>
      <div class="resumo-item"><b class="tabular">${formatarPreco(previsto)}</b><span>previsto</span></div>
      <div class="resumo-item"><b class="tabular">${formatarPreco(recebido)}</b><span>recebido</span></div>
    </div>
    ${paraLembrar.length ? `<button class="btn-lembrar" type="button" data-acao="lembrar-todos" data-data="${iso}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      Enviar lembrete pros ${paraLembrar.length} cliente(s) do dia</button>` : ''}
    <div class="linha-tempo">${linha}</div>
    ${cancelados.length ? `<details class="cancelados-dia"><summary>Cancelados (${cancelados.length})</summary>
      <div class="linha-tempo">${cancelados.map(htmlSlotAg).join('')}</div></details>` : ''}`;
}

function htmlSemana(inicio) {
  let total = 0; let valor = 0;
  const dias = Array.from({ length: 7 }, (_, i) => {
    const iso = somarDiasISO(inicio, i);
    const ags = agsDoDia(iso).filter((a) => ativo(a) && (filtroBarbeiro === 'todos' || a.barbeiroId === filtroBarbeiro));
    total += ags.length; valor += ags.reduce((s, a) => s + (a.status === 'faltou' ? 0 : precoDe(a)), 0);
    const fechado = !periodosDoDia(iso).length;
    const bloq = bloqueiosDoDia(iso).find((b) => b.diaTodo);
    const livres = fechado || bloq ? 0 : montarGrade(iso).livres.length;
    const lista = ags.map((a) => `
      <button class="linha-compacta" type="button" data-acao="abrir-ag" data-id="${escaparHTML(a.id)}">
        <span class="hora tabular">${paraHHMM(a.horarioMin)}</span>
        <span class="meio"><b>${escaparHTML(a.clienteNome)}</b><span>${escaparHTML(nomeServicoDe(a))}</span></span>
        <span class="selo st-${a.status}">${ROTULOS_STATUS[a.status] || ''}</span>
      </button>`).join('');
    const info = bloq ? `bloqueado${bloq.motivo ? ' · ' + escaparHTML(bloq.motivo) : ''}` : fechado ? 'fechado' : `${ags.length} agend. · ${livres} livre(s)`;
    return `<div class="semana-dia">
      <h3><button type="button" data-acao="ver-dia" data-data="${iso}" style="font-weight:800">${escaparHTML(dataLonga(iso))}</button><span>${info}</span></h3>
      ${lista || (fechado || bloq ? '' : `<button class="linha-compacta" type="button" data-acao="novo-ag" data-data="${iso}"><span class="meio"><span>Nenhum agendamento — toque para agendar</span></span><span class="dim">+</span></button>`)}
    </div>`;
  }).join('');
  return `
    <div class="resumo-dia" style="margin-top:1rem;grid-template-columns:1fr 1fr">
      <div class="resumo-item"><b class="tabular">${total}</b><span>agendamentos na semana</span></div>
      <div class="resumo-item"><b class="tabular">${formatarPreco(valor)}</b><span>previsto na semana</span></div>
    </div>${dias}`;
}

function abrirCalendario(ym) {
  const mes = ym || dataSel.slice(0, 7);
  const [y, m] = mes.split('-').map(Number);
  const primeiroDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const total = ultimoDiaMes(mes);
  const hoje = hojeISO();
  let celulas = SIGLAS_SEMANA.map((s) => `<div class="cal-sem">${s}</div>`).join('');
  celulas += '<div class="cal-dia vazio"></div>'.repeat(primeiroDow);
  for (let d = 1; d <= total; d++) {
    const iso = `${mes}-${String(d).padStart(2, '0')}`;
    const n = contarDoDia(iso);
    const fechado = !periodosDoDia(iso).length || bloqueiosDoDia(iso).some((b) => b.diaTodo);
    celulas += `<button class="cal-dia ${iso === hoje ? 'hoje' : ''} ${iso === dataSel ? 'sel' : ''} ${fechado ? 'fechado' : ''}" type="button" data-acao="cal-escolher" data-data="${iso}">
      ${d}<small>${n ? n : '&nbsp;'}</small></button>`;
  }
  abrirSheet('Escolher dia', `
    <div class="cal-cabecalho">
      <button type="button" data-acao="cal-mes" data-mes="${somarMeses(mes, -1)}" aria-label="Mês anterior">‹</button>
      <b>${escaparHTML(nomeMes(mes))}</b>
      <button type="button" data-acao="cal-mes" data-mes="${somarMeses(mes, 1)}" aria-label="Próximo mês">›</button>
    </div>
    <div class="cal-grade">${celulas}</div>
    <p class="dim" style="font-size:.78rem;margin-top:.8rem">O número embaixo de cada dia é a quantidade de agendamentos.</p>`);
}

function ligarSugestoes(caixa, inData, inHora, ignorarId) {
  const desenhar = () => {
    if (!inData.value) { caixa.innerHTML = ''; return; }
    const { livres, periodos } = montarGrade(inData.value, ignorarId);
    if (!periodos.length) { caixa.innerHTML = '<span class="dim" style="font-size:.8rem">Dia fechado pelo horário de funcionamento.</span>'; return; }
    const min = inData.value === hojeISO() ? agoraMin() : -1;
    const lista = livres.filter((l) => l.min >= min - CONFIG_PAINEL.intervaloMin);
    caixa.innerHTML = lista.length
      ? `<span class="dim" style="font-size:.78rem;width:100%">Horários livres:</span>` + lista.map((l) => `<button type="button" class="${paraHHMM(l.min) === inHora.value ? 'ativo' : ''}" data-h="${paraHHMM(l.min)}">${paraHHMM(l.min)}</button>`).join('')
      : '<span class="dim" style="font-size:.8rem">Nenhum horário livre nesse dia.</span>';
    caixa.querySelectorAll('button[data-h]').forEach((b) => b.addEventListener('click', () => {
      inHora.value = b.dataset.h; inHora.dispatchEvent(new Event('input')); desenhar();
    }));
  };
  inData.addEventListener('change', desenhar);
  inHora.addEventListener('change', desenhar);
  desenhar();
}

/* ---------- Novo agendamento ---------- */
function abrirNovoAgendamento({ data, hora, chaveCli } = {}) {
  const cliente = chaveCli ? acharCliente(chaveCli) : null;
  const clientes = listaClientes().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  abrirSheet('Novo agendamento', `
    <form id="form-novo" novalidate>
      <div class="campo" id="campo-nome"><label for="novo-nome">Cliente</label>
        <input type="text" id="novo-nome" list="lista-nomes" placeholder="Nome do cliente" autocomplete="off" value="${escaparHTML(cliente ? cliente.nome : '')}">
        <datalist id="lista-nomes">${clientes.map((c) => `<option value="${escaparHTML(c.nome)}">${escaparHTML(formatarTelefone(c.telefone))}</option>`).join('')}</datalist>
      </div>
      <div class="campo"><label for="novo-telefone">WhatsApp</label>
        <input type="tel" id="novo-telefone" placeholder="(98) 99999-9999" value="${escaparHTML(cliente ? formatarTelefone(cliente.telefone) : '')}"></div>
      <div class="campo"><label for="novo-servico">Serviço</label>
        <select id="novo-servico">${servicosAtivos().map((s) => `<option value="${escaparHTML(s.id)}">${escaparHTML(s.nome)} — ${formatarPreco(s.preco)} (${s.duracaoMin} min)</option>`).join('')}</select></div>
      ${barbeirosAtivos().length > 1 ? `<div class="campo"><label for="novo-barbeiro">Barbeiro</label>
        <select id="novo-barbeiro">${barbeirosAtivos().map((b) => `<option value="${escaparHTML(b.id)}" ${filtroBarbeiro === b.id ? 'selected' : ''}>${escaparHTML(b.nome)}</option>`).join('')}</select></div>`
        : `<input type="hidden" id="novo-barbeiro" value="${escaparHTML((barbeirosAtivos()[0] || {}).id || '')}">`}
      <div class="linha-2">
        <div class="campo" id="campo-data"><label for="novo-data">Data</label><input type="date" id="novo-data" value="${data || dataSel || hojeISO()}"></div>
        <div class="campo" id="campo-hora"><label for="novo-hora">Horário</label><input type="time" id="novo-hora" step="300" value="${hora || ''}"></div>
      </div>
      <div class="horarios-sugeridos" id="novo-sugeridos"></div>
      <div class="aviso-conflito" id="novo-conflito" hidden></div>
      <div class="campo"><label for="novo-obs">Observação</label><textarea id="novo-obs" placeholder="Opcional"></textarea></div>
      <button class="btn-primario" type="submit">Agendar</button>
    </form>`, (corpo) => {
    const $ = (s) => corpo.querySelector(s);
    const porNome = new Map(clientes.map((c) => [c.nome.toLowerCase(), c]));
    $('#novo-nome').addEventListener('change', () => {
      const c = porNome.get($('#novo-nome').value.trim().toLowerCase());
      if (c && c.telefone && !$('#novo-telefone').value) $('#novo-telefone').value = formatarTelefone(c.telefone);
    });
    ligarSugestoes($('#novo-sugeridos'), $('#novo-data'), $('#novo-hora'), null);
    const checarConflito = () => {
      const servico = acharServico($('#novo-servico').value);
      const d = $('#novo-data').value; const h = $('#novo-hora').value;
      const aviso = $('#novo-conflito');
      if (!d || !h || !servico) { aviso.hidden = true; return; }
      const ini = paraMinutos(h); const fim = ini + servico.duracaoMin;
      const bid = $('#novo-barbeiro').value;
      const conflito = agsDoDia(d).some((a) => ativo(a) && a.barbeiroId === bid && a.horarioMin < fim && a.horarioMin + duracaoDe(a) > ini);
      const fora = !periodosDoDia(d).some(([a, b]) => ini >= a && fim <= b);
      const msgs = [];
      if (conflito) msgs.push('Já existe outro agendamento nesse horário.');
      if (fora) msgs.push('Fica fora do horário de funcionamento.');
      aviso.hidden = !msgs.length;
      aviso.textContent = msgs.join(' ') + (msgs.length ? ' Você ainda pode salvar assim mesmo.' : '');
    };
    ['#novo-data', '#novo-hora', '#novo-servico', '#novo-barbeiro'].forEach((s) => {
      $(s).addEventListener('input', checarConflito); $(s).addEventListener('change', checarConflito);
    });
    checarConflito();
    $('#form-novo').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = $('#novo-nome').value.trim();
      const d = $('#novo-data').value; const h = $('#novo-hora').value;
      let ok = true;
      marcarErroCampo(corpo, 'campo-nome', nome ? '' : 'Digite o nome do cliente'); if (!nome) ok = false;
      marcarErroCampo(corpo, 'campo-data', d ? '' : 'Escolha a data'); if (!d) ok = false;
      marcarErroCampo(corpo, 'campo-hora', h ? '' : 'Escolha o horário'); if (!h) ok = false;
      if (!ok) return;
      const servico = acharServico($('#novo-servico').value);
      const barbeiro = acharBarbeiro($('#novo-barbeiro').value) || { id: $('#novo-barbeiro').value, nome: '' };
      const telefone = soDigitos($('#novo-telefone').value);
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
      const id = await criarRegistro('agendamentos', {
        data: d, horarioMin: paraMinutos(h),
        servicoId: servico.id, servicoNome: servico.nome, servicoPreco: Number(servico.preco), duracaoMin: Number(servico.duracaoMin),
        barbeiroId: barbeiro.id, barbeiroNome: barbeiro.nome,
        clienteNome: nome, telefone, obs: $('#novo-obs').value.trim(),
        status: 'confirmado', origem: 'painel',
      });
      btn.disabled = false;
      if (!id) return;
      dataSel = d; modoAgenda = 'dia';
      if (viewAtual !== 'agenda') trocarView('agenda'); else renderAtual();
      if (telefone) {
        const msg = preencherModelo(prefs.msgConfirmacao, { nome, data: d, hora: h, servico: servico.nome, barbeiro: barbeiro.nome });
        abrirSheet('Agendado ✓', `
          <p style="font-size:.95rem"><b>${escaparHTML(nome)}</b> · ${escaparHTML(servico.nome)}<br><span class="dim">${escaparHTML(dataLonga(d))} às ${h}</span></p>
          <p class="dim" style="font-size:.86rem;margin-top:1rem">Quer mandar a confirmação pro cliente pelo WhatsApp?</p>
          <div class="info-banner" style="margin-top:.6rem;font-size:.84rem">${escaparHTML(msg)}</div>
          <div class="grade-acoes"><a class="btn zap" href="${linkWhatsApp(telefone, msg)}" target="_blank" rel="noopener" data-acao="fechar-sheet">Enviar confirmação</a>
          <button class="btn" type="button" data-acao="fechar-sheet">Agora não</button></div>`);
      } else { fecharSheet(); toast('Agendado ✓'); }
    });
  });
}

function marcarErroCampo(raiz, idCampo, mensagem) {
  const campo = raiz.querySelector('#' + idCampo);
  if (!campo) return;
  campo.classList.toggle('tem-erro', !!mensagem);
  let p = campo.querySelector('.campo-erro');
  if (!p) { p = document.createElement('p'); p.className = 'campo-erro'; campo.appendChild(p); }
  p.hidden = !mensagem; p.textContent = mensagem || '';
}

function renderListaClientes() {
  const alvo = document.getElementById('lista-clientes');

  document.querySelectorAll('#filtros-clientes .chip').forEach((c) => c.classList.toggle('ativo', c.dataset.f === filtroClientes));
  const hoje = hojeISO();
  const mesAtual = hoje.slice(5, 7);
  const termo = buscaClientes.trim().toLowerCase();
  const termoDig = soDigitos(termo);
  let lista = listaClientes().filter((c) => !termo || c.nome.toLowerCase().includes(termo) || (termoDig && c.telefone.includes(termoDig)));
  let extra = (c) => c.ultimaVisita ? `última: ${quandoRelativo(c.ultimaVisita)}` : (c.proximo ? 'primeira visita marcada' : 'sem visitas');
  if (filtroClientes === 'todos') lista.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  if (filtroClientes === 'recentes') lista = lista.filter((c) => c.ultimaVisita).sort((a, b) => b.ultimaVisita.localeCompare(a.ultimaVisita));
  if (filtroClientes === 'aniversario') {
    lista = lista.filter((c) => c.aniversario && c.aniversario.slice(0, 2) === mesAtual).sort((a, b) => a.aniversario.localeCompare(b.aniversario));
    extra = (c) => `aniversário ${c.aniversario.slice(3)}/${c.aniversario.slice(0, 2)}`;
  }
  if (filtroClientes === 'sumidos') {
    lista = lista.filter((c) => c.ultimaVisita && !c.proximo && diasEntre(c.ultimaVisita, hoje) > 35).sort((a, b) => a.ultimaVisita.localeCompare(b.ultimaVisita));
    extra = (c) => `há ${diasEntre(c.ultimaVisita, hoje)} dias`;
  }
  if (filtroClientes === 'top') lista = lista.filter((c) => c.totalGasto > 0).sort((a, b) => b.totalGasto - a.totalGasto);

  const dicas = {
    aniversario: 'Clientes com aniversário cadastrado neste mês.',
    sumidos: 'Vieram antes, mas não aparecem há mais de 35 dias e não têm horário marcado. Bom momento pra chamar de volta.',
  };
  alvo.innerHTML = (dicas[filtroClientes] ? `<p class="dim" style="font-size:.8rem;margin:.2rem 0 .4rem">${dicas[filtroClientes]}</p>` : '') + (lista.length ? lista.map((c) => `
    <button class="cli-item" type="button" data-acao="abrir-cliente" data-chave="${escaparHTML(c.chave)}">
      <span class="avatar">${escaparHTML(iniciais(c.nome))}</span>
      <span class="cli-meio"><b>${escaparHTML(c.nome)}</b><span class="tabular">${c.telefone ? escaparHTML(formatarTelefone(c.telefone)) : 'sem telefone'}</span></span>
      <span class="cli-direita"><b class="tabular">${filtroClientes === 'top' ? formatarPreco(c.totalGasto) : c.visitas + ' visita' + (c.visitas === 1 ? '' : 's')}</b>${escaparHTML(extra(c))}</span>
    </button>`).join('') : `<p class="lista-vazia">${termo ? 'Nenhum cliente encontrado.' : 'Nenhum cliente aqui ainda.'}</p>`);
}

function despesasDoMes(ym) {
  return estado.despesas.filter((d) => {
    if (!d.data) return false;
    if (d.fixa) return d.data.slice(0, 7) <= ym && (!d.encerradaEm || d.encerradaEm > ym);
    return d.data.slice(0, 7) === ym;
  }).map((d) => {
    if (!d.fixa) return d;
    const dia = Math.min(Number(d.data.slice(8)), ultimoDiaMes(ym));
    return { ...d, dataNoMes: `${ym}-${String(dia).padStart(2, '0')}` };
  });
}

  ].sort((a, b) => b.ordem.localeCompare(a.ordem));

    </div>
    <div class="cartao fin-saldo"><span>Lucro do mês</span><b class="tabular ${saldo < 0 ? 'negativo' : ''}">${formatarPreco(saldo)}</b></div>
    <div class="fin-duplo">
      <div class="cartao"><span>Receitas</span><b class="tabular cor-sucesso">${formatarPreco(receitas)}</b></div>
      <div class="cartao"><span>Despesas</span><b class="tabular cor-erro">${formatarPreco(totalDesp)}</b></div>
    </div>
    <div class="cartao" style="margin-top:.6rem">
      <div class="meta-topo"><b>Meta do mês</b><button class="btn-texto" type="button" data-acao="editar-meta">${meta ? formatarPreco(meta) + ' · alterar' : 'definir meta'}</button></div>
      <div class="meta-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      <div class="meta-rodape"><span>${pct}% atingido</span><span>${meta > receitas ? 'faltam ' + formatarPreco(meta - receitas) : meta ? 'meta batida! 🎉' : ''}</span></div>
      ${aReceber ? `<p class="dim" style="font-size:.8rem;margin-top:.6rem">Ainda tem <b style="color:var(--texto)">${formatarPreco(aReceber)}</b> em horários marcados até o fim do mês.</p>` : ''}
    </div>
    ${Object.keys(porForma).length ? `<div class="titulo-secao">Recebido por forma de pagamento</div>
    <div class="cartao barras">${Object.entries(porForma).sort((a, b) => b[1] - a[1]).map(([f, v]) => `
      <div class="barra-linha"><span>${escaparHTML(FORMAS_PAGAMENTO[f] || 'Não informado')}</span><span class="val tabular">${formatarPreco(v)}</span>

    <div class="titulo-secao">Lançamentos</div>
    ${lancamentos.length ? lancamentos.map((l) => `

      </div>`).join('') : '<p class="lista-vazia">Nenhum lançamento neste mês. Atendimentos finalizados entram aqui como receita; use o botão + pra lançar despesas.</p>'}`;
}

const PERIODOS = { semana: 'Últimos 7 dias', mes: 'Este mês', 'mes-anterior': 'Mês passado', '90d': 'Últimos 90 dias', ano: 'Este ano' };
function intervaloPeriodo(p) {
  const hoje = hojeISO();
  if (p === 'semana') return [somarDiasISO(hoje, -6), hoje];
  if (p === 'mes') return [hoje.slice(0, 7) + '-01', hoje.slice(0, 7) + '-' + ultimoDiaMes(hoje.slice(0, 7))];
  if (p === 'mes-anterior') { const ym = somarMeses(hoje.slice(0, 7), -1); return [ym + '-01', ym + '-' + ultimoDiaMes(ym)]; }
  if (p === '90d') return [somarDiasISO(hoje, -89), hoje];
  return [hoje.slice(0, 4) + '-01-01', hoje.slice(0, 4) + '-12-31'];
}
function montarRelatorios() {
  document.getElementById('view-relatorios').innerHTML = `
    <div class="chips" id="chips-periodo">${Object.entries(PERIODOS).map(([k, v]) => `<button class="chip ${periodoRelatorio === k ? 'ativo' : ''}" type="button" data-acao="periodo" data-p="${k}">${v}</button>`).join('')}</div>
    <div id="relatorio-corpo"></div>`;
  renderRelatorios();
}
function renderRelatorios() {
  const alvo = document.getElementById('relatorio-corpo');
  if (!alvo) return;
  document.querySelectorAll('#chips-periodo .chip').forEach((c) => c.classList.toggle('ativo', c.dataset.p === periodoRelatorio));
  const [ini, fim] = intervaloPeriodo(periodoRelatorio);
  const ags = estado.agendamentos.filter((a) => a.data >= ini && a.data <= fim);
  const feitos = ags.filter((a) => a.status === 'concluido');
  const faltas = ags.filter((a) => a.status === 'faltou').length;
  const cancel = ags.filter((a) => a.status === 'cancelado').length;
  const fat = feitos.reduce((s, a) => s + precoDe(a), 0);
  const ticket = feitos.length ? fat / feitos.length : 0;
  const taxaFalta = feitos.length + faltas ? Math.round((faltas / (feitos.length + faltas)) * 100) : 0;
  const clientes = listaClientes();
  const novos = clientes.filter((c) => c.primeiraData && c.primeiraData >= ini && c.primeiraData <= fim).length;
  const atendidos = new Set(feitos.map((a) => chaveCliente(a.clienteNome, a.telefone))).size;
  const doSite = ags.filter((a) => a.origem === 'site').length;

  const porServico = {};
  feitos.forEach((a) => { const n = nomeServicoDe(a); porServico[n] = porServico[n] || { qtd: 0, valor: 0 }; porServico[n].qtd++; porServico[n].valor += precoDe(a); });
  const servs = Object.entries(porServico).sort((a, b) => b[1].valor - a[1].valor);
  const maxServ = Math.max(1, ...servs.map(([, v]) => v.valor));

  const porDia = [0, 0, 0, 0, 0, 0, 0];
  feitos.forEach((a) => { porDia[diaSemana(a.data)]++; });
  const maxDia = Math.max(1, ...porDia);

  const porHora = {};
  feitos.forEach((a) => { const h = Math.floor(a.horarioMin / 60); porHora[h] = (porHora[h] || 0) + 1; });
  const horasTop = Object.entries(porHora).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([h]) => `${String(h).padStart(2, '0')}h`);

  const topClientes = clientes.map((c) => {
    const v = c.ags.filter((a) => a.status === 'concluido' && a.data >= ini && a.data <= fim);
    return { c, qtd: v.length, valor: v.reduce((s, a) => s + precoDe(a), 0) };
  }).filter((x) => x.qtd).sort((a, b) => b.valor - a.valor).slice(0, 5);

  if (!ags.length) { alvo.innerHTML = `<p class="lista-vazia">Sem agendamentos em “${PERIODOS[periodoRelatorio]}”.</p>`; return; }

  alvo.innerHTML = `
    <p class="dim" style="font-size:.78rem;margin:.8rem 0">${escaparHTML(dataCurta(ini))} a ${escaparHTML(dataCurta(fim))}</p>
    <div class="kpis">
      <div class="kpi"><b class="tabular">${formatarPreco(fat)}</b><span>faturamento</span></div>
      <div class="kpi"><b class="tabular">${feitos.length}</b><span>atendimentos finalizados</span></div>
      <div class="kpi"><b class="tabular">${formatarPreco(ticket)}</b><span>ticket médio</span></div>
      <div class="kpi"><b class="tabular">${atendidos}</b><span>clientes atendidos · ${novos} novo(s)</span></div>

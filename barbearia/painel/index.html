function ligarLinhasEditor(seletorPai, lista, rerender) {
  document.querySelectorAll(`${seletorPai} .editor-linha`).forEach((linha) => {
    const i = Number(linha.dataset.i);
    linha.querySelectorAll('[data-campo]').forEach((input) => {
      input.addEventListener('input', () => {
        const campo = input.dataset.campo;
        lista[i][campo] = input.type === 'number' ? Number(input.value || 0) : input.value;
        if (campo === 'nome') lista[i].id = slugify(input.value);
      });
    });
    linha.querySelector('[data-remover]').addEventListener('click', () => { lista.splice(i, 1); rerender(); });
  });
}
function renderHorariosEditor() {
  const d = dadosCatalogoEdicao;
  document.getElementById('ed-horarios').innerHTML = DIAS_SEMANA_CATALOGO.map((nome, i) => {
    const bloco = (d.horarios[i] && d.horarios[i][0]) || null;
    return `
      <div class="editor-dia" data-dia="${i}">
        <span class="editor-dia-nome">${nome}</span>
        <label style="display:flex;align-items:center;gap:.35rem;font-size:.85rem"><input type="checkbox" data-campo="aberto" ${bloco ? 'checked' : ''}> aberto</label>
        <input type="time" data-campo="inicio" value="${bloco ? bloco[0] : '09:00'}" ${bloco ? '' : 'disabled'} aria-label="Abre às">
        <span class="dim">às</span>
        <input type="time" data-campo="fim" value="${bloco ? bloco[1] : '19:00'}" ${bloco ? '' : 'disabled'} aria-label="Fecha às">
      </div>`;
  }).join('');
  document.querySelectorAll('#ed-horarios .editor-dia').forEach((linha) => {
    const dia = Number(linha.dataset.dia);
    const inputAberto = linha.querySelector('[data-campo=aberto]');
    const inputInicio = linha.querySelector('[data-campo=inicio]');
    const inputFim = linha.querySelector('[data-campo=fim]');
    const sincronizar = () => {
      inputInicio.disabled = !inputAberto.checked;
      inputFim.disabled = !inputAberto.checked;
      d.horarios[dia] = inputAberto.checked ? [[inputInicio.value, inputFim.value]] : [];
    };
    inputAberto.addEventListener('change', sincronizar);
    inputInicio.addEventListener('input', sincronizar);
    inputFim.addEventListener('input', sincronizar);
  });
}
async function salvarCatalogo() {
  const btn = document.getElementById('salvar-catalogo-btn');
  const statusEl = document.getElementById('salvar-status');
  btn.disabled = true; statusEl.textContent = 'Salvando…';
  try {
    await db.collection('configuracao').doc('dados').set(dadosCatalogoEdicao);
    catalogoRemoto = JSON.parse(JSON.stringify(dadosCatalogoEdicao));
    statusEl.textContent = 'Salvo! O site atualiza sozinho em até 5 minutos (ou na próxima visita).';
  } catch (e) {
    statusEl.textContent = 'Erro ao salvar: ' + e.message;
  } finally { btn.disabled = false; }
}
async function importarAgendamentosLocaisPraFirebase() {
  const locais = lerLocal(CHAVES_LOCAIS.agendamentos, []);
  if (!locais.length) { alert('Não há agendamentos salvos neste aparelho pra importar.'); return; }
  if (!(await confirmar('Importar agendamentos?', `${locais.length} agendamento(s) salvos neste aparelho vão pro Firebase.`, 'Importar', false))) return;
  try {
    const lote = db.batch();
    for (const ag of locais) {
      const { id, ...campos } = ag;
      lote.set(db.collection('agendamentos').doc(), { ...campos, origem: 'painel-importado', criadoEm: firebase.firestore.FieldValue.serverTimestamp() });
    }
    await lote.commit();
    localStorage.setItem(CHAVES_LOCAIS.agendamentos, '[]');
    alert('Importado! Os agendamentos agora vivem no Firebase.');
    renderEditorCatalogo();
  } catch (e) { alert('Não foi possível importar: ' + e.message); }
}

/* ---------- Avisos no celular (Firebase Cloud Messaging, opcional) ---------- */
async function tokenNotificacaoAtual() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    const registro = await navigator.serviceWorker.getRegistration('../firebase-messaging-sw.js');
    if (!registro || Notification.permission !== 'granted') return null;
    return await firebase.messaging().getToken({ vapidKey: window.FIREBASE_VAPID_KEY, serviceWorkerRegistration: registro });
  } catch (e) { return null; }
}
async function atualizarStatusNotificacoes() {
  const statusEl = document.getElementById('notif-status');
  const btn = document.getElementById('btn-ativar-notif');
  if (!statusEl || !btn) return;
  if (!('Notification' in window) || !('serviceWorker' in navigator)) { statusEl.textContent = 'Esse navegador não suporta avisos push.'; btn.disabled = true; return; }
  if (!window.FIREBASE_VAPID_KEY || window.FIREBASE_VAPID_KEY === 'COLE_AQUI') { statusEl.textContent = 'Chave VAPID ainda não configurada (veja o README).'; return; }
  const token = await tokenNotificacaoAtual();
  if (token) { statusEl.textContent = 'Avisos ativados neste aparelho ✓'; btn.textContent = 'Reativar avisos'; }
}
async function ativarNotificacoes() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) { alert('Esse navegador não suporta avisos push.'); return; }
  const vapidKey = window.FIREBASE_VAPID_KEY;
  if (!vapidKey || vapidKey === 'COLE_AQUI') { alert('Falta configurar a chave VAPID em firebase-config.js. Veja o README.'); return; }
  const statusEl = document.getElementById('notif-status');
  try {
    const permissao = await Notification.requestPermission();
    if (permissao !== 'granted') { statusEl.textContent = 'Permissão negada. Ative nas configurações do navegador se mudar de ideia.'; return; }
    const registro = await navigator.serviceWorker.register('../firebase-messaging-sw.js');
    const token = await firebase.messaging().getToken({ vapidKey, serviceWorkerRegistration: registro });
    await db.collection('donoDispositivos').doc(token).set({ token, criadoEm: firebase.firestore.FieldValue.serverTimestamp(), userAgent: navigator.userAgent });
    statusEl.textContent = 'Avisos ativados neste aparelho ✓';
    document.getElementById('btn-ativar-notif').textContent = 'Reativar avisos';
  } catch (e) { statusEl.textContent = 'Não foi possível ativar: ' + e.message; }
}

/* =========================================================
   12. FICHA (bottom sheet) e cliques
   ========================================================= */
let focoAntesSheet = null;
function abrirSheet(titulo, html, aoMontar) {
  const fundo = document.getElementById('sheet-fundo');
  if (resolverConfirmacao) { const r = resolverConfirmacao; resolverConfirmacao = null; r(false); }
  if (fundo.hidden) focoAntesSheet = document.activeElement;
  document.getElementById('sheet-titulo').textContent = titulo;
  const corpo = document.getElementById('sheet-corpo');
  corpo.innerHTML = html;
  fundo.hidden = false;
  document.body.style.overflow = 'hidden';
  fundo.querySelector('.sheet').scrollTop = 0;
  if (aoMontar) aoMontar(corpo);
  const primeiro = corpo.querySelector('input:not([type=hidden]):not([type=radio]),select,textarea');
  (primeiro && window.matchMedia('(min-width:640px)').matches ? primeiro : fundo.querySelector('.sheet-fechar')).focus({ preventScroll: true });
}
let resolverConfirmacao = null;
// Confirmação dentro do próprio painel (as caixinhas do navegador ficam
// feias no celular e não aparecem em alguns aplicativos).
function confirmar(titulo, texto, rotuloOk, perigo = true) {
  if (resolverConfirmacao) resolverConfirmacao(false);
  return new Promise((resolver) => {
    abrirSheet(titulo, `
      <p style="font-size:.92rem">${escaparHTML(texto)}</p>
      <div class="grade-acoes">
        <button class="btn" type="button" data-acao="fechar-sheet">Voltar</button>
        <button class="btn ${perigo ? 'perigo' : 'cheio'}" type="button" id="btn-confirmar">${escaparHTML(rotuloOk)}</button>
      </div>`, (corpo) => {
      corpo.querySelector('#btn-confirmar').addEventListener('click', () => {
        resolverConfirmacao = null; fecharSheet(); resolver(true);
      });
    });
    resolverConfirmacao = resolver;
  });
}
function fecharSheet() {
  const fundo = document.getElementById('sheet-fundo');
  if (resolverConfirmacao) { const r = resolverConfirmacao; resolverConfirmacao = null; r(false); }
  if (fundo.hidden) return;
  fundo.hidden = true;
  document.body.style.overflow = '';
  if (focoAntesSheet && document.contains(focoAntesSheet)) focoAntesSheet.focus({ preventScroll: true });
}
document.getElementById('sheet-fundo').addEventListener('click', (e) => { if (e.target.id === 'sheet-fundo') fecharSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharSheet(); });

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-acao]');
  if (!el) return;
  const a = el.dataset.acao;
  const id = el.dataset.id;
  switch (a) {
    case 'fechar-sheet': fecharSheet(); break;
    case 'fab':
    case 'novo-ag': abrirNovoAgendamento({ data: el.dataset.data, hora: el.dataset.hora }); break;
    case 'novo-cliente': abrirEditarCliente(null); break;
    case 'nova-despesa': abrirNovaDespesa(); break;
    case 'ir-hoje': dataSel = hojeISO(); renderAgenda(); atualizarTopo(); break;
    case 'sair': sair(); break;
    case 'sel-dia': dataSel = el.dataset.data; renderAgenda(); atualizarTopo(); break;
    case 'ver-dia': dataSel = el.dataset.data; modoAgenda = 'dia'; renderAgenda(); atualizarTopo(); window.scrollTo({ top: 0 }); break;
    case 'semana': dataSel = somarDiasISO(dataSel, Number(el.dataset.n)); renderAgenda(); atualizarTopo(); break;
    case 'modo-agenda': modoAgenda = el.dataset.modo; renderAgenda(); break;
    case 'filtro-barbeiro': filtroBarbeiro = el.dataset.id; renderAgenda(); break;
    case 'abrir-calendario': abrirCalendario(); break;
    case 'cal-mes': abrirCalendario(el.dataset.mes); break;
    case 'cal-escolher': dataSel = el.dataset.data; modoAgenda = 'dia'; fecharSheet(); if (viewAtual !== 'agenda') trocarView('agenda'); else { renderAgenda(); atualizarTopo(); } break;
    case 'abrir-ag': abrirAgendamento(id); break;
    case 'finalizar': abrirFinalizar(id); break;
    case 'reagendar': abrirReagendar(id); break;
    case 'status': {
      const st = el.dataset.status;
      if (st === 'cancelado' && !(await confirmar('Cancelar este agendamento?', 'O horário volta a ficar livre na agenda.', 'Cancelar agendamento'))) return;
      const campos = { status: st };
      if (st === 'confirmado') campos.pagamento = null;
      if (await atualizarRegistro('agendamentos', id, campos)) { fecharSheet(); toast(st === 'confirmado' ? 'Agendamento reaberto' : 'Marcado como ' + ROTULOS_STATUS[st].toLowerCase()); }
      break;
    }
    case 'excluir-ag':
      if (!(await confirmar('Excluir este agendamento?', 'Ele some da agenda, do histórico do cliente e do financeiro. Não dá pra desfazer.', 'Excluir'))) return;
      if (await removerRegistro('agendamentos', id)) { fecharSheet(); toast('Agendamento excluído'); }
      break;
    case 'lembrar-todos': abrirLembrarTodos(el.dataset.data); break;
    case 'abrir-cliente': abrirCliente(el.dataset.chave); break;
    case 'agendar-cliente': abrirNovoAgendamento({ chaveCli: el.dataset.chave }); break;
    case 'editar-cliente': abrirEditarCliente(el.dataset.chave); break;
    case 'remover-cadastro':
      if (!(await confirmar('Apagar a ficha do cliente?', 'O aniversário e a observação são apagados. Os agendamentos dele continuam.', 'Apagar ficha'))) return;
      if (await removerRegistro('clientes', id)) { fecharSheet(); toast('Ficha apagada'); }
      break;
    case 'filtro-clientes': filtroClientes = el.dataset.f; renderListaClientes(); break;
    case 'mes-fin': mesFinanceiro = somarMeses(mesFinanceiro, Number(el.dataset.n)); renderFinanceiro(); break;
    case 'editar-meta': abrirEditarMeta(); break;
    case 'remover-despesa': {
      const d = estado.despesas.find((x) => x.id === id);
      if (d && d.fixa) {
        if (!(await confirmar('Encerrar despesa fixa?', 'Ela para de se repetir a partir deste mês. Os meses anteriores continuam com ela.', 'Encerrar'))) return;
        const ok = d.data.slice(0, 7) >= mesFinanceiro ? await removerRegistro('despesas', id) : await atualizarRegistro('despesas', id, { encerradaEm: mesFinanceiro });
        if (ok) toast('Despesa fixa encerrada');
      } else {
        if (!(await confirmar('Remover esta despesa?', 'Ela sai do financeiro deste mês.', 'Remover'))) return;
        if (await removerRegistro('despesas', id)) toast('Despesa removida');
      }
      break;
    }
    case 'periodo': periodoRelatorio = el.dataset.p; renderRelatorios(); break;
    case 'sub-mais': subMais = el.dataset.sub || null; montarMais(); atualizarTopo(); window.scrollTo({ top: 0 }); break;
    case 'remover-bloqueio':
      if (await removerRegistro('bloqueios', id)) { renderListaBloqueios(); toast('Bloqueio removido'); }
      break;
    default: break;
  }
});

/* =========================================================
   13. LOGIN DO DONO (Firebase)
   ========================================================= */
if (auth) {
  auth.onAuthStateChanged(async (user) => {
    const appVisivel = !document.getElementById('app-painel').hidden;
    if (user) {
      let dono = false;
      try { dono = (await user.getIdTokenResult()).claims.owner === true; } catch (e) { /* trata como não-dono */ }
      if (!dono) { mostrarErroLogin('Esta conta não tem acesso ao painel do dono.'); await auth.signOut(); return; }
    } else if (appVisivel) { location.reload(); return; }
    catalogoAutenticado = !!user;
    if (user) { modoRemoto = true; iniciarListenersRemotos(); mostrarApp(); }
    else { modoRemoto = false; pararListenersRemotos(); }
  });
}

/* =========================================================
   14. DADOS DE EXEMPLO (só no modo prévia)
   ========================================================= */
function semearDemo() {
  let semente = 7;
  const rnd = () => { semente = (semente * 9301 + 49297) % 233280; return semente / 233280; };
  const escolher = (l) => l[Math.floor(rnd() * l.length)];
  const nomes = ['Carlos Eduardo Lima', 'João Pedro Sousa', 'Matheus Ribeiro', 'Lucas Ferreira', 'Rafael Costa', 'Gabriel Martins',
    'Felipe Araújo', 'Bruno Cardoso', 'Thiago Almeida', 'André Nogueira', 'Diego Pinheiro', 'Vinícius Rocha', 'Leandro Moraes', 'Paulo Henrique Silva'];
  const clientes = nomes.map((n, i) => ({ nome: n, tel: '98900000' + String(100 + i).slice(-3) }));
  const hoje = hojeISO();
  const servs = CONFIG_PAINEL.servicos;
  const peso = ['corte', 'corte', 'corte', 'combo', 'combo', 'barba', 'navalha', 'sobrancelha'];
  const formas = ['pix', 'pix', 'pix', 'dinheiro', 'debito', 'credito'];
  const ags = [];
  const usados = new Set();
  const add = (data, min, cli, servId, status, extra = {}) => {
    const s = servs.find((x) => x.id === servId);
    const chave = data + min;
    if (usados.has(chave)) return; usados.add(chave);
    const ag = {
      id: gerarId(), data, horarioMin: min, servicoId: s.id, servicoNome: s.nome, servicoPreco: s.preco, duracaoMin: s.duracaoMin,
      barbeiroId: 'rickelme', barbeiroNome: 'Rickelme', clienteNome: cli.nome, telefone: cli.tel, obs: '', status,
      origem: rnd() < 0.55 ? 'site' : 'painel', criadoEm: Date.now(), ...extra,
    };
    if (status === 'concluido') ag.pagamento = { forma: escolher(formas), valor: s.preco };
    ags.push(ag);
  };
  const horas = [540, 600, 660, 840, 900, 960, 1020, 1080];
  // passado: ~80 dias de atendimentos (os 3 últimos clientes "somem" há 40+ dias)
  for (let d = -80; d < 0; d++) {
    const iso = somarDiasISO(hoje, d);
    if (diaSemana(iso) === 0) continue;
    const n = 2 + Math.floor(rnd() * 4);
    for (let k = 0; k < n; k++) {
      const cli = d < -40 ? escolher(clientes) : escolher(clientes.slice(0, 11));
      const st = rnd() < 0.07 ? 'faltou' : rnd() < 0.06 ? 'cancelado' : 'concluido';
      add(iso, escolher(horas), cli, escolher(peso), st);
    }
  }
  // hoje
  const agora = agoraMin();
  [[540, 0, 'corte'], [600, 1, 'combo'], [720 - 60, 2, 'barba'], [870, 3, 'corte'], [960, 4, 'navalha'], [1050, 5, 'corte']].forEach(([m, i, s]) => {
    add(hoje, m, clientes[i], s, m + 30 <= agora ? 'concluido' : 'confirmado');
  });
  ags.find((a) => a.data === hoje && a.horarioMin === 870).obs = 'Quer o degradê mais baixo nas laterais';
  // próximos dias
  for (let d = 1; d <= 12; d++) {
    const iso = somarDiasISO(hoje, d);
    if (diaSemana(iso) === 0) continue;
    const n = d <= 3 ? 4 : 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) add(iso, escolher(horas), escolher(clientes.slice(0, 11)), escolher(peso), 'confirmado');
  }
  estado.agendamentos = ags;
  const mesAtual = hoje.slice(5, 7);
  estado.clientes = [
    { id: gerarId(), nome: clientes[1].nome, telefone: clientes[1].tel, aniversario: `${mesAtual}-${String(Math.min(28, Number(hoje.slice(8)) + 3)).padStart(2, '0')}`, obs: 'Prefere ser atendido de manhã' },
    { id: gerarId(), nome: clientes[3].nome, telefone: clientes[3].tel, aniversario: `${mesAtual}-${hoje.slice(8)}`, obs: '' },
  ];
  const ym = hoje.slice(0, 7);
  estado.despesas = [
    { id: gerarId(), descricao: 'Aluguel do salão', valor: 900, data: somarMeses(ym, -3) + '-05', categoria: 'Aluguel', fixa: true },
    { id: gerarId(), descricao: 'Internet', valor: 99.9, data: somarMeses(ym, -3) + '-10', categoria: 'Internet', fixa: true },
    { id: gerarId(), descricao: 'Lâminas e pós-barba', valor: 186.5, data: ym + '-03', categoria: 'Produtos', fixa: false },
    { id: gerarId(), descricao: 'Conta de luz', valor: 214.3, data: ym + '-12', categoria: 'Energia', fixa: false },
  ];
  const proxBloq = (() => { let d = 4; while (diaSemana(somarDiasISO(hoje, d)) === 0) d++; return somarDiasISO(hoje, d); })();
  estado.bloqueios = [
    { id: gerarId(), data: proxBloq, diaTodo: false, inicio: '17:00', fim: '19:00', motivo: 'Consulta médica' },
    { id: gerarId(), data: somarDiasISO(hoje, 9), diaTodo: true, inicio: null, fim: null, motivo: 'Folga' },
  ];
}

function inicializarApp() {
  if (DEMO) { document.getElementById('faixa-demo').hidden = false; semearDemo(); }
  else if (!modoRemoto) carregarLocais();
  dataSel = hojeISO();
  mesFinanceiro = dataSel.slice(0, 7);
  trocarView('agenda');
  carregarCatalogoRemoto();
}

if (DEMO) mostrarApp();
else if (!firebaseConfigurado && jaEstaLogado()) mostrarApp();
